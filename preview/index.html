<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManaCall — Android app preview</title>
<style>
:root {
  color-scheme: light;
  font-family: "Inter", system-ui, "Noto Sans Telugu", sans-serif;
  color: #18203a;
  background: #eef0f8;
  --paper: #faf9ff;
  --ink: #18203a;
  --muted: #4e5770;
  --primary: #333889;
  --border: #d8d9e8;
  --lavender: #e9e9fa;
}
* { box-sizing: border-box; }
body { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .photo-grid:focus-visible { outline: 3px solid #4e53bd; outline-offset: 3px; }
.page { max-width: 990px; margin: auto; padding: 32px 28px; }
.preview-heading { max-width: 790px; margin: 0 auto 18px; }
.preview-heading h1 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
.preview-heading p { margin: 5px 0 0; font-size: 15px; color: var(--muted); }
.screens { display: grid; grid-template-columns: repeat(2, minmax(0, 380px)); justify-content: center; gap: 30px; }
.phone { background: var(--paper); border: 1px solid #d5d8e9; border-radius: 28px; box-shadow: 0 14px 30px #262b5812; overflow: hidden; min-width: 0; }
.screen { display: flex; flex-direction: column; height: 736px; min-width: 0; }
.app-bar { padding: 17px 18px; min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 24px; letter-spacing: -.045em; }
.glyph { inline-size: 24px; block-size: 24px; flex: none; }
.brand-icon { flex: none; inline-size: 38px; block-size: 38px; background: var(--primary); color: white; border-radius: 12px; }
.language { display: inline-flex; padding: 2px; background: #efeff8; border: 1px solid var(--border); border-radius: 14px; }
.language button { min-height: 44px; min-width: 43px; border: 0; border-radius: 11px; padding: 0 8px; background: transparent; font-size: 14px; font-weight: 730; }
.language button[aria-pressed="true"] { background: var(--primary); color: white; }
.grid-scroll, .detail-scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-color: #b4b5d2 transparent; }
.grid-scroll { padding: 12px 18px 18px; }
.search { display: flex; flex: none; align-items: center; gap: 10px; margin: 10px 18px 0; padding: 0 10px 0 14px; min-height: 54px; border: 1px solid #8588a4; border-radius: 15px; color: var(--primary); }
.search:focus-within { outline: 2px solid var(--primary); }
.search input { flex: 1; width: 0; min-height: 48px; font: inherit; color: var(--ink); background: transparent; border: 0; outline: none; padding: 0; }
.search input::-webkit-search-cancel-button { display: none; }
.search button { display: grid; place-items: center; min-height: 44px; min-width: 44px; border: 0; background: transparent; color: var(--primary); }
.grid-heading { margin: 0 0 14px; font-size: 27px; line-height: 1.2; letter-spacing: -.035em; }
.photo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.contact { display: flex; align-items: stretch; flex-direction: column; min-width: 0; padding: 0; border-radius: 17px; overflow: hidden; border: 1px solid var(--border); background: white; text-align: center; }
.contact:hover { border-color: var(--primary); }
.contact[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--primary); border-color: var(--primary); }
.portrait { display: block; width: 100%; aspect-ratio: 1; background-color: #dddff1; background-image: url("portraits.png"); background-size: 200% 200%; background-repeat: no-repeat; }
.portrait[data-person="0"] { background-position: left top; }
.portrait[data-person="1"] { background-position: right top; }
.portrait[data-person="2"] { background-position: left bottom; }
.portrait[data-person="3"] { background-position: right bottom; }
.portrait[data-person="4"] { display: grid; place-items: center; background-image: none; color: var(--primary); font-weight: 780; font-size: 54px; }
.contact-name { display: grid; place-items: center; padding: 9px 5px; min-height: 47px; font-weight: 750; font-size: 18px; line-height: 1.25; overflow-wrap: anywhere; }
.back { display: grid; place-items: center; border: 0; border-radius: 15px; background: var(--lavender); padding: 0; inline-size: 48px; block-size: 48px; color: var(--primary); }
.favorite { display: grid; place-items: center; border: 0; border-radius: 15px; background: var(--lavender); padding: 0; inline-size: 48px; block-size: 48px; color: var(--primary); }
.favorite[aria-pressed="true"] { color: white; background: var(--primary); }
.favorite .glyph { inline-size: 34px; block-size: 34px; }
.back .glyph { inline-size: 30px; block-size: 30px; }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; padding: 7px 10px; border-top: 1px solid var(--border); }
.tabs button { display: grid; place-items: center; min-height: 52px; width: 100%; color: var(--primary); border: 0; background: transparent; border-radius: 17px; }
.tabs button .glyph { inline-size: 34px; block-size: 34px; }
.tabs button[aria-pressed="true"] { color: white; background: var(--primary); }
[hidden] { display: none !important; }
.detail-scroll { padding: 20px 18px; }
.hero { width: min(100%, 344px); margin: auto; border-radius: 24px; }
.name { margin: 10px 0 2px; text-align: center; font-size: 30px; line-height: 1.25; letter-spacing: -.035em; overflow-wrap: anywhere; }
.number { margin: 0; text-align: center; font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 10px; margin-top: 16px; }
.call { display: flex; flex: 1; flex-direction: column; justify-content: center; align-items: center; gap: 5px; min-height: 104px; padding: 10px; border: 1px solid transparent; border-radius: 16px; }
.call span { font-weight: 750; line-height: 1.2; }
.recents { margin-top: 22px; }
.call .glyph { inline-size: 44px; block-size: 44px; }
.call.phone-call { color: white; background: var(--primary); }
.call.whatsapp { color: #123b2d; background: #e3f1eb; border-color: #c8ddd2; }
.call:hover { filter: brightness(.96); }
.notice { margin: 11px 0 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
.screen-footer { height: 25px; display: grid; place-items: center; flex: none; }
.screen-footer::before { content: ""; width: 100px; height: 4px; border-radius: 4px; background: #312e45; }
dialog { max-width: min(380px, calc(100% - 32px)); color: var(--ink); background: var(--paper); border: 1px solid var(--border); border-radius: 20px; padding: 22px; }
dialog::backdrop { background: #171b3b65; }
dialog p { line-height: 1.5; margin: 10px 0 18px; }
dialog button { border: 0; background: var(--primary); color: white; border-radius: 12px; min-height: 48px; padding: 0 18px; font-weight: 700; }
@media (max-width: 700px) {
  body { background: var(--paper); }
  .page { padding: 0; }
  .preview-heading { padding: 11px 18px; margin: 0; background: #eef0f8; border-bottom: 1px solid var(--border); }
  .preview-heading h1 { display: none; }
  .preview-heading p { margin: 0; font-size: 13px; }
  .screens { display: block; }
  .phone { border: 0; border-radius: 0; box-shadow: none; }
  .screen { height: calc(100dvh - 40px); }
  .screens:not(.show-detail) .detail-phone, .screens.show-detail .grid-phone { display: none; }
}
@media (max-width: 360px) {
  .app-bar, .grid-scroll, .detail-scroll { padding-inline: 12px; }
  .brand { font-size: 20px; }
  .brand-icon { display: none; }
}
</style>
</head>

<main class="page">
  <header class="preview-heading">
    <h1>ManaCall <span aria-hidden="true">/</span> Android preview</h1>
    <p data-copy="demo">Open Favorites and scroll to Recents. Tap a photo to try the call buttons. Calls are simulated.</p>
  </header>
  <div class="screens">
    <section class="phone grid-phone" aria-labelledby="contacts-heading">
      <div class="screen">
        <div class="app-bar">
          <div class="brand"><svg class="brand-icon" aria-hidden="true"><use href="#i-app"/></svg>ManaCall</div>
          <div class="language" role="group" aria-label="Language">
            <button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
            <button type="button" data-language="te" lang="te" aria-pressed="false">తెలుగు</button>
          </div>
        </div>
        <div class="search" role="search">
          <svg class="glyph" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="search" maxlength="100" placeholder="Search contacts" aria-label="Search contacts">
          <button class="clear-search" type="button" aria-label="Clear search" hidden><svg class="glyph" aria-hidden="true"><use href="#i-clear"/></svg></button>
        </div>
        <div class="grid-scroll">
          <h2 id="contacts-heading" class="grid-heading">Photo contacts</h2>
          <div class="photo-grid"></div>
          <p class="notice no-results" data-copy="noResults" role="status" hidden>No matching contacts</p>
          <section class="recents" hidden>
            <h2 class="grid-heading" data-copy="recents">Recents</h2>
            <div class="photo-grid recent-grid"></div>
          </section>
        </div>
        <nav class="tabs" aria-label="Contact views">
          <button type="button" data-tab="favorites" aria-label="Favorites" title="Favorites" aria-pressed="false"><svg class="glyph solid" aria-hidden="true"><use href="#i-solid-star"/></svg></button>
          <button type="button" data-tab="photos" aria-label="Photo contacts" title="Photo contacts" aria-pressed="true"><svg class="glyph solid" aria-hidden="true"><use href="#i-solid-photo"/></svg></button>
          <button type="button" data-tab="all" aria-label="All contacts" title="All contacts" aria-pressed="false"><svg class="glyph solid" aria-hidden="true"><use href="#i-solid-people"/></svg></button>
        </nav>
        <div class="screen-footer" aria-hidden="true"></div>
      </div>
    </section>
    <section class="phone detail-phone" aria-labelledby="contact-name">
      <div class="screen">
        <div class="app-bar">
          <button class="back" type="button" aria-label="Back to contacts"><svg class="glyph" aria-hidden="true"><use href="#i-back"/></svg></button>
          <button class="favorite" type="button" aria-label="Remove from Favorites" aria-pressed="true"><svg class="glyph solid" aria-hidden="true"><use href="#i-solid-star"/></svg></button>
        </div>
        <div class="detail-scroll">
          <div class="portrait hero" aria-hidden="true"></div>
          <h2 class="name" id="contact-name" tabindex="-1"></h2>
          <p class="number" dir="ltr"></p>
          <div class="actions">
            <button class="call phone-call" data-action="phone" type="button" aria-label="Normal call">
              <svg class="glyph solid" aria-hidden="true"><use href="#i-solid-phone"/></svg>
            </button>
            <button class="call whatsapp" data-action="video" type="button" aria-label="WhatsApp video call">
              <svg class="glyph solid" aria-hidden="true"><use href="#i-solid-video"/></svg>
              <span data-copy="video">WhatsApp video call</span>
            </button>
          </div>
          <p class="notice" hidden data-copy="noNumber">This contact has no phone number in Android Contacts.</p>
        </div>
        <div class="screen-footer" aria-hidden="true"></div>
      </div>
    </section>
  </div>
</main>

<script>
const copy = {
  en: {
    demo: "Open Favorites and scroll to Recents. Tap a photo to try the call buttons. Calls are simulated.",
    favorites: "Favorites", photos: "Photo contacts", all: "All contacts", back: "Back to contacts", views: "Contact views", language: "Language", phone: "Normal call",
    recents: "Recents", video: "WhatsApp video call",
    search: "Search contacts", clearSearch: "Clear search", results: "Search results", noResults: "No matching contacts", emptyFavorites: "No favorites yet", addFavorite: "Add to Favorites", removeFavorite: "Remove from Favorites",
    noNumber: "This contact has no phone number in Android Contacts.", close: "Close",
    phoneDemo: "On Android, granting Phone permission lets this button start the call directly.",

  },
  te: {
    demo: "ఫొటో, నక్షత్రం లేదా వ్యక్తుల గుర్తును నొక్కండి. ఇది కాల్‌ల ప్రివ్యూ.",
    favorites: "ఇష్టమైనవారు", photos: "ఫొటో కాంటాక్ట్‌లు", all: "అన్ని కాంటాక్ట్‌లు", back: "కాంటాక్ట్‌లకు తిరిగి వెళ్లండి", views: "కాంటాక్ట్‌ల విభాగాలు", language: "భాష", phone: "సాధారణ కాల్",
    recents: "ఇటీవలి కాల్స్", video: "వాట్సాప్ వీడియో కాల్",
    search: "కాంటాక్ట్‌లను వెతకండి", clearSearch: "వెతికిన పదాన్ని తొలగించండి", results: "వెతికిన ఫలితాలు", noResults: "పేరుకు సరిపోయే కాంటాక్ట్‌లు లేవు", emptyFavorites: "ఇంకా ఇష్టమైనవారు లేరు", addFavorite: "ఇష్టమైనవారికి జోడించండి", removeFavorite: "ఇష్టమైనవారి నుంచి తొలగించండి",
    noNumber: "ఈ కాంటాక్ట్‌కు ఫోన్ నంబర్ సేవ్ చేయలేదు.", close: "మూసివేయండి",
    phoneDemo: "ఫోన్ అనుమతి ఇచ్చిన తర్వాత ఈ బటన్ నేరుగా కాల్ చేస్తుంది.",
    videoDemo: "ఎంచుకున్న నంబర్‌కు వాట్సాప్ వీడియో కాల్ అందుబాటులో ఉన్నప్పుడు ఈ బటన్ కనిపిస్తుంది."
  }
};
const people = [
  { name: "Amma", favorite: true, video: true, number: "+91 ••••• ••101" },
  { name: "Nanna", number: "+91 ••••• ••102" },
  { name: "Anjali", video: true, number: "+91 ••••• ••103" },
  { name: "Ammamma", favorite: true, number: "+91 ••••• ••104" },
  { name: "Balu", number: "" }
];
const grid = document.querySelector(".photo-grid");
const recentSection = document.querySelector(".recents");
const recentGrid = document.querySelector(".recent-grid");
const gridScroll = document.querySelector(".grid-scroll");
const search = document.querySelector(".search");
let recentOrder = [2, 1, 0, 3];
let previousScroll = 0;
let scrollTimer;
gridScroll.addEventListener("scroll", () => {
  const next = gridScroll.scrollTop;
  if (next === previousScroll) return;
  if (next > previousScroll && document.activeElement !== searchInput) {
    search.hidden = true;
  }
  previousScroll = next;
  clearTimeout(scrollTimer);
  if (search.hidden) {
    scrollTimer = setTimeout(() => { search.hidden = false; }, 5000);
  }
});
const searchInput = document.querySelector(".search input");
const clearSearch = document.querySelector(".clear-search");
const favoriteButton = document.querySelector(".favorite");
const actionButtons = [...document.querySelectorAll("[data-action]")];
const screens = document.querySelector(".screens");
const dialog = document.querySelector("dialog");
const narrow = matchMedia("(max-width: 700px)");
let selected = 0;
let language = "en";
let tab = "photos";
const placeholder = '<svg class="glyph solid" aria-hidden="true"><use href="#i-solid-person"/></svg>';
const tabs = [...document.querySelectorAll("[data-tab]")];
const contactButtons = people.map(makeContactButton);
function makeContactButton(person, index) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "contact";
  button.dataset.contact = index;
  button.setAttribute("aria-pressed", String(index === selected));
  const portrait = document.createElement("span");
  portrait.className = "portrait";
  portrait.dataset.person = index;
  portrait.setAttribute("aria-hidden", "true");
  if (index === 4) portrait.innerHTML = placeholder;
  const name = document.createElement("span");
  name.className = "contact-name";
  name.textContent = person.name;
  button.append(portrait, name);
  button.addEventListener("click", () => {
    selected = index;
    updateContact();
    screens.classList.add("show-detail");
    document.querySelector(".detail-scroll").scrollTop = 0;
    if (narrow.matches) document.querySelector("#contact-name").focus();
  });
  return button;
}
function updateContact() {
  const { name, number, video } = people[selected];
  document.querySelector("#contact-name").textContent = name;
  document.querySelector(".number").textContent = number;
  const hero = document.querySelector(".hero");
  hero.dataset.person = selected;
  hero.innerHTML = selected === 4 ? placeholder : "";
  document.querySelector(".actions").hidden = !number;
  document.querySelector("[data-action=video]").hidden = !video;
  document.querySelector(".detail-scroll .notice").hidden = Boolean(number);
  document.querySelectorAll("[data-contact]").forEach(button =>
    button.setAttribute("aria-pressed", String(Number(button.dataset.contact) === selected)));
  updateFavoriteButton();
}
function updateFavoriteButton() {
  const favorite = Boolean(people[selected].favorite);
  favoriteButton.setAttribute("aria-pressed", String(favorite));
  favoriteButton.setAttribute("aria-label", copy[language][favorite ? "removeFavorite" : "addFavorite"]);
  favoriteButton.title = favoriteButton.getAttribute("aria-label");
  favoriteButton.querySelector("use").setAttribute("href", favorite ? "#i-solid-star" : "#i-solid-star_outline");
}
function words(text) {
  return text.normalize("NFKC").toLowerCase().split(/[^\p{L}\p{M}\p{N}]+/u).filter(Boolean);
}
function edits(term, word) {
  const table = Array.from({length: term.length + 1}, (_, i) => [i]);
  table[0] = Array.from({length: word.length + 1}, (_, j) => j);
  for (let i = 1; i <= term.length; i++) {
    for (let j = 1; j <= word.length; j++) {
      table[i][j] = Math.min(table[i - 1][j] + 1, table[i][j - 1] + 1,
        table[i - 1][j - 1] + Number(term[i - 1] !== word[j - 1]));
      if (i > 1 && j > 1 && term[i - 1] === word[j - 2] && term[i - 2] === word[j - 1]) {
        table[i][j] = Math.min(table[i][j], table[i - 2][j - 2] + 1);
      }
    }
  }
  return table[term.length][word.length];
}
function rank(terms, name) {
  if (!terms.length) return Infinity;
  const parts = words(name);
  if (parts.join(" ") === terms.join(" ")) return 0;
  return terms.reduce((total, term) => total + Math.min(...parts.map(part => {
    if (part === term) return 0;
    if (part.startsWith(term)) return 1;
    if (part.includes(term)) return 2;
    const limit = term.length < 3 ? 0 : term.length < 6 ? 1 : 2;
    const distance = edits(term, part);
    return distance <= limit ? 3 + distance : Infinity;
  })), 1);
}
function updateTab(changeSelection = true) {
  const searching = searchInput.value.trim() !== "";
  const terms = words(searchInput.value);
  document.querySelector("#contacts-heading").textContent = copy[language][searching ? "results" : tab];
  searchInput.placeholder = copy[language].search;
  searchInput.setAttribute("aria-label", copy[language].search);
  clearSearch.setAttribute("aria-label", copy[language].clearSearch);
  clearSearch.hidden = searchInput.value === "";
  actionButtons.forEach(button => {
    const label = copy[language][button.dataset.action];
    button.setAttribute("aria-label", label);
    button.title = label;
  });
  document.querySelector(".tabs").setAttribute("aria-label", copy[language].views);
  document.querySelector(".back").setAttribute("aria-label", copy[language].back);
  tabs.forEach(button => {
    const destination = button.dataset.tab;
    button.setAttribute("aria-pressed", String(destination === tab));
    button.setAttribute("aria-label", copy[language][destination]);
    button.title = copy[language][destination];
  });
  const results = people.map((person, index) => ({
    index,
    score: searching ? rank(terms, person.name) : 0,
  })).sort((a, b) => {
    const aName = people[a.index].name;
    const bName = people[b.index].name;
    const alphabetical = aName.localeCompare(bName, language);
    return a.score === b.score ? alphabetical : a.score - b.score;
  });
  for (const {index, score} of results) {
    const button = contactButtons[index];
    button.hidden = searching ? score === Infinity :
      (tab === "photos" && index === 4) || (tab === "favorites" && !people[index].favorite);
    grid.append(button);
  }
  const firstVisible = results.find(({index}) => !contactButtons[index].hidden);
  const empty = document.querySelector(".no-results");
  empty.textContent = copy[language][searching ? "noResults" : "emptyFavorites"];
  empty.hidden = Boolean(firstVisible) || (!searching && tab !== "favorites");
  if (changeSelection && contactButtons[selected].hidden && firstVisible) {
    selected = firstVisible.index;
    updateContact();
  }
  recentSection.hidden = searching || tab !== "favorites";
  if (!recentSection.hidden) {
    recentGrid.replaceChildren(...recentOrder.map(index => makeContactButton(people[index], index)));
  }
  updateFavoriteButton();
}
favoriteButton.addEventListener("click", () => {
  people[selected].favorite = !people[selected].favorite;
  updateTab(false);
});
tabs.forEach(button => button.addEventListener("click", () => {
  tab = button.dataset.tab;
  searchInput.value = "";
  updateTab();
  document.querySelector(".grid-scroll").scrollTop = 0;
}));
searchInput.addEventListener("input", () => {
  updateTab();
  document.querySelector(".grid-scroll").scrollTop = 0;
});
clearSearch.addEventListener("click", () => {
  searchInput.value = "";
  updateTab();
  searchInput.focus();
});
document.querySelector(".back").addEventListener("click", () => {
  screens.classList.remove("show-detail");
  if (contactButtons[selected].hidden) {
    tabs.find(button => button.dataset.tab === tab).focus();
  } else {
    contactButtons[selected].focus();
  }
});
document.querySelectorAll("[data-language]").forEach(button => button.addEventListener("click", () => {
  language = button.dataset.language;
  document.documentElement.lang = language;
  document.querySelectorAll("[data-copy]").forEach(node => node.textContent = copy[language][node.dataset.copy]);
  document.querySelector(".language").setAttribute("aria-label", copy[language].language);
  updateTab(false);
  document.querySelectorAll("[data-language]").forEach(option => option.setAttribute("aria-pressed", String(option === button)));
}));
actionButtons.forEach(button => button.addEventListener("click", () => {
  const action = button.dataset.action;
  recentOrder = [selected, ...recentOrder.filter(index => index !== selected)];
  updateTab(false);
  document.querySelector("#action-title").textContent = copy[language][action];
  document.querySelector("#action-preview").textContent = copy[language][action + "Demo"];
  dialog.showModal();
}));
updateContact();
updateTab();
</script>
